<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="js/api.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Shorto | Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }

        .menu-toggle { position: fixed; top: 15px; left: 15px; z-index: 1001; background: rgba(168,85,247,0.9); border: none; color: white; width: 45px; height: 45px; border-radius: 12px; font-size: 1.3rem; cursor: pointer; display: none; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100%; background: rgba(15,23,42,0.98); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); padding: 2rem 1rem; z-index: 1000; transition: transform 0.3s; }
        .sidebar.closed { transform: translateX(-100%); }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; margin-bottom: 2rem; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; margin: 5px 0; border-radius: 12px; color: #94a3b8; cursor: pointer; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: rgba(168,85,247,0.2); color: white; }
        .menu-item i { width: 24px; }

        .main-content { margin-left: 260px; padding: 2rem; position: relative; z-index: 1; min-height: 100vh; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
            background: rgba(15,23,42,0.5); backdrop-filter: blur(10px);
            padding: 1rem 1.5rem; border-radius: 24px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; background: rgba(30,41,59,0.6); padding: 0.5rem 1rem; border-radius: 40px; cursor: pointer; }
        .avatar { width: 35px; height: 35px; background: linear-gradient(135deg,#a855f7,#ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .chat-container {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .chat-list {
            width: 300px;
            background: rgba(30,41,59,0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
        }
        .chat-list-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 600;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-item:hover, .chat-item.active {
            background: rgba(168,85,247,0.2);
        }
        .chat-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-info {
            flex: 1;
        }
        .chat-name {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .chat-preview {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .chat-window {
            flex: 1;
            background: rgba(30,41,59,0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .message-bubble {
            max-width: 70%;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            position: relative;
        }
        .message-sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-bottom-right-radius: 5px;
        }
        .message-received {
            align-self: flex-start;
            background: rgba(15,23,42,0.8);
            border-bottom-left-radius: 5px;
        }
        .message-text {
            font-size: 0.9rem;
        }
        .message-time {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.3rem;
            text-align: right;
        }
        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 0.8rem;
        }
        .chat-input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            color: white;
            font-family: inherit;
        }
        .chat-input:focus {
            outline: none;
            border-color: #a855f7;
        }
        .chat-send-btn {
            padding: 0.8rem 1.2rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .empty-chat {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; padding-top: 70px; }
            .chat-container { flex-direction: column; }
            .chat-list { width: 100%; max-height: 250px; overflow-y: auto; }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

<div class="sidebar" id="sidebar">
    <div class="logo">🕊️ Shorto</div>
    <div onclick="navigate('dashboard.html')" class="menu-item"><i class="fas fa-home"></i> Dashboard</div>
    <div onclick="navigate('send.html')" class="menu-item"><i class="fas fa-paper-plane"></i> Send Message</div>
    <div onclick="navigate('sky.html')" class="menu-item"><i class="fas fa-globe"></i> Flying Sky</div>
    <div onclick="navigate('requests.html')" class="menu-item"><i class="fas fa-handshake"></i> Requests</div>
    <div onclick="navigate('messages.html')" class="menu-item active"><i class="fas fa-comments"></i> Messages</div>
    <div onclick="navigate('profile.html')" class="menu-item"><i class="fas fa-user"></i> Profile</div>
    <div onclick="logout()" class="menu-item" style="margin-top: 2rem; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</div>
</div>

<div class="main-content">
    <div class="header">
        <h2><i class="fas fa-comments" style="color: #a855f7;"></i> Messages</h2>
        <div class="user-info" onclick="navigate('profile.html')">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <span id="userName">User</span>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-list">
            <div class="chat-list-header"><i class="fas fa-users"></i> Conversations</div>
            <div id="chatList"></div>
        </div>
        <div class="chat-window" id="chatWindow">
            <div class="empty-chat">
                <i class="fas fa-comment-dots" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <p>Select a conversation to start chatting!</p>
                <small style="color: #64748b;">When someone accepts your request, you can chat here.</small>
            </div>
        </div>
    </div>
</div>
<script>
    for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = Math.random() * 3 + 1 + 'px';
        star.style.height = star.style.width;
        star.style.animationDelay = Math.random() * 5 + 's';
        document.getElementById('stars').appendChild(star);
    }

    const sidebar = document.getElementById('sidebar');
    document.getElementById('menuToggle').onclick = () => sidebar.classList.toggle('open');
    function navigate(page) { window.location.href = page; }
    function logout() { localStorage.removeItem('currentUser'); localStorage.removeItem('token'); window.location.href = 'index.html'; }

    let user = null;
    try {
        const u = localStorage.getItem('currentUser');
        if (u && u !== 'undefined') user = JSON.parse(u);
    } catch(e) {}
    if (!user) user = { email: 'demo@shorto.com', fullname: 'Demo User' };
    document.getElementById('userName').innerText = user.fullname || user.email.split('@')[0];

    // Initialize Socket.io
    const socket = io();
    socket.emit('join', user.email);
    
    socket.on('new_message', (data) => {
    console.log('📨 New message:', data);
    
    // IGNORE if message is from myself (already added via HTTP)
    if (data.fromEmail === user.email) {
        console.log('⚠️ Ignoring own message from socket');
        return;
    }

    // If current chat is open, add message directly
    if (currentChatId === data.chatId) {
        const chatMessages = document.getElementById('chatMessages');
        if (chatMessages) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-bubble message-received';
            messageDiv.innerHTML = `
                <div class="message-text">${escapeHtml(data.message)}</div>
                <div class="message-time">${new Date().toLocaleTimeString()}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Update last message in chat list
        const chatItems = document.querySelectorAll('.chat-item');
        for (let item of chatItems) {
            if (item.innerHTML.includes(data.chatId)) {
                const previewSpan = item.querySelector('.chat-preview');
                if (previewSpan) previewSpan.innerText = data.message.substring(0, 30);
                break;
            }
        }
    } else {
        loadChats(); // Only refresh chat list, not whole page
    }
});

    let currentChatId = null;

    async function loadChats() {
        const token = localStorage.getItem('token');
        if (!token) return;

        if (window.isLoadingChats) return;
        window.isLoadingChats = true;

        try {
            const response = await fetch('/api/chats', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();

            const chatListDiv = document.getElementById('chatList');

            if (!data.chats || data.chats.length === 0) {
                chatListDiv.innerHTML = `<div class="empty-state" style="padding: 2rem; text-align: center; color: #64748b;">No conversations yet.<br>Accept requests to start chatting!</div>`;
                return;
            }

            chatListDiv.innerHTML = data.chats.map(chat => `
                <div class="chat-item ${currentChatId === chat.chat_id ? 'active' : ''}" onclick="openChat('${chat.chat_id}', '${chat.other_user.split('@')[0]}', '${chat.other_user}')">
                    <div class="chat-avatar"><i class="fas fa-user"></i></div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.other_user.split('@')[0]}</div>
                        <div class="chat-preview">${chat.last_message ? chat.last_message.substring(0, 30) : 'Start a conversation!'}</div>
                    </div>
                </div>
            `).join('');
        } catch(e) {
            console.error('Error loading chats:', e);
        }
    }

    async function openChat(chatId, otherName, otherEmail) {
        currentChatId = chatId;
        loadChats();

        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`/api/chat/${encodeURIComponent(chatId)}/messages`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();

            const chatWindow = document.getElementById('chatWindow');
            chatWindow.innerHTML = `
                <div class="chat-header">
                    <div class="chat-avatar" style="width: 40px; height: 40px;"><i class="fas fa-user"></i></div>
                    <div>
                        <div style="font-weight: 600;">${otherName}</div>
                        <div style="font-size: 0.7rem; color: #94a3b8;">${otherEmail}</div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    ${data.messages?.map(msg => `
                        <div class="message-bubble ${msg.from_email === user.email ? 'message-sent' : 'message-received'}">
                            <div class="message-text">${escapeHtml(msg.message)}</div>
                            <div class="message-time">${new Date(msg.created_at).toLocaleTimeString()}</div>
                        </div>
                    `).join('') || '<div class="empty-chat" style="padding: 2rem;">No messages yet. Say hello!</div>'}
                </div>
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage('${chatId}')">
                    <button class="chat-send-btn" onclick="sendMessage('${chatId}')"><i class="fas fa-paper-plane"></i></button>
                </div>
            `;

            setTimeout(() => {
                const msgs = document.getElementById('chatMessages');
                if (msgs) msgs.scrollTop = msgs.scrollHeight;
            }, 100);
        } catch(e) {
            console.error('Error loading messages:', e);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendMessage(chatId) {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !chatId) return;

    const token = localStorage.getItem('token');
    try {
        const response = await fetch('/api/chat/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ chatId, message: text })
        });
        const data = await response.json();
        if (data.success) {
            input.value = '';
            
            // Add message directly to chat window (NO REFRESH)
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-bubble message-sent';
                messageDiv.innerHTML = `
                    <div class="message-text">${escapeHtml(text)}</div>
                    <div class="message-time">${new Date().toLocaleTimeString()}</div>
                `;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Update last message in chat list
            const chatItems = document.querySelectorAll('.chat-item');
            for (let item of chatItems) {
                if (item.innerHTML.includes(chatId)) {
                    const previewSpan = item.querySelector('.chat-preview');
                    if (previewSpan) previewSpan.innerText = text.substring(0, 30);
                    break;
                }
            }
            
            // Emit via Socket for real-time to other user
            const otherEmail = document.querySelector('.chat-header div div:last-child')?.innerText;
            if (otherEmail) {
                socket.emit('send_message', {
                    chatId: chatId,
                    message: text,
                    fromEmail: user.email,
                    toEmail: otherEmail
                });
            }
        }
    } catch(e) {
        console.error('Error sending message:', e);
    }
}

    loadChats();
    setInterval(loadChats, 5000);
</script>
</body>
</html>
