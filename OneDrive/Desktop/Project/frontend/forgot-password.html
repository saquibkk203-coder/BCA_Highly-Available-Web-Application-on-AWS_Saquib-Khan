<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorto | Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .forgot-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168,85,247,0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(168,85,247,0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            color: #94a3b8;
        }

        .login-link a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            text-align: center;
        }

        .success-msg {
            color: #4ade80;
            font-size: 0.8rem;
            margin-top: 0.3rem;
            text-align: center;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .step-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #64748b;
        }

        .step-dot.active {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
        }

        .step-dot.completed {
            background: #4ade80;
            color: white;
        }
    </style>
</head>
<body>

<div class="forgot-container">
    <div class="logo">🕊️ Shorto</div>

    <div class="step-indicator">
        <div class="step-dot" id="step1Dot">1</div>
        <div class="step-dot" id="step2Dot">2</div>
    </div>

    <!-- Step 1: Email -->
    <div class="step active" id="step1">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Reset Password</h2>
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" placeholder="Enter your registered email">
            <div class="error-msg" id="emailError"></div>
        </div>
        <button class="btn-submit" onclick="sendResetOTP()">
            <i class="fas fa-paper-plane"></i> Send OTP
        </button>
    </div>

    <!-- Step 2: OTP + New Password -->
    <div class="step" id="step2">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Set New Password</h2>
        <div class="form-group">
            <label><i class="fas fa-key"></i> OTP Code</label>
            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
            <div class="error-msg" id="otpError"></div>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password (min 6 chars)">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
        </div>
        <div class="error-msg" id="resetError"></div>
        <div class="success-msg" id="resetSuccess"></div>
        <button class="btn-submit" onclick="resetPassword()">
            <i class="fas fa-check-circle"></i> Reset Password
        </button>
    </div>

    <div class="login-link">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
</div>

<script>
    let userEmail = '';

    async function sendResetOTP() {
        const email = document.getElementById('email').value;
        if (!email) {
            document.getElementById('emailError').innerText = 'Please enter your email';
            return;
        }

        document.getElementById('emailError').innerText = 'Sending...';

        try {
            const response = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await response.json();

            if (data.success) {
                userEmail = email;
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                document.getElementById('step1Dot').classList.add('completed');
                document.getElementById('step2Dot').classList.add('active');
                document.getElementById('emailError').innerText = '';
            } else {
                document.getElementById('emailError').innerText = data.message;
            }
        } catch(e) {
            document.getElementById('emailError').innerText = 'Network error. Try again.';
        }
    }

    async function resetPassword() {
        const otp = document.getElementById('otp').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!otp || !newPassword || !confirmPassword) {
            document.getElementById('resetError').innerText = 'All fields are required';
            return;
        }

        if (newPassword !== confirmPassword) {
            document.getElementById('resetError').innerText = 'Passwords do not match';
            return;
        }

        if (newPassword.length < 6) {
            document.getElementById('resetError').innerText = 'Password must be at least 6 characters';
            return;
        }

        document.getElementById('resetError').innerText = 'Resetting password...';

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userEmail, otp, newPassword })
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('resetSuccess').innerText = data.message + ' Redirecting to login...';
                document.getElementById('resetError').innerText = '';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                document.getElementById('resetError').innerText = data.message;
            }
        } catch(e) {
            document.getElementById('resetError').innerText = 'Network error. Try again.';
        }
    }
</script>

</body>
</html>
